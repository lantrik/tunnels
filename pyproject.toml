[project]
name = "tunnels"
version = "0.1.0"
description = "CLI-менеджер обратных SSH-туннелей с .env + YAML конфигами"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
]

[tool.uv]
dev-dependencies = []

[project.scripts]
tunnels = "tunnels.__main__:main"
